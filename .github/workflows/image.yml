# Builds the app's image for amd64 and arm64 (a Raspberry Pi, say) and
# publishes it to GitHub's container registry. The same image runs the app on
# its own (docker run / compose) and is what the Home Assistant add-on builds on.
#
#   main         → ghcr.io/peitzgreene/node-samsung-emdx:latest
#   tag v1.2.3   → ghcr.io/peitzgreene/node-samsung-emdx:1.2.3 (and 1.2)
#
# For a release, set the same version in homeassistant-addon/config.yaml and
# build.yaml, then push a tag like v1.2.3. Make the package public once (its
# settings on GitHub) so Home Assistant can pull it without signing in.
name: Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # Registry names must be lowercase
  IMAGE: ghcr.io/peitzgreene/node-samsung-emdx

jobs:
  addon-lint:
    name: Check the add-on
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./homeassistant-addon

  image:
    name: Build the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
